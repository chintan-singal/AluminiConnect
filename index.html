<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alumni Connect · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/hero.css">
</head><body>
<div class="layout">
<aside>
  <div class="crest"><i id="brandLetter">A</i><span id="brandName">Alumni Connect</span></div>
  <nav id="nav">
    <a href="#home" class="on">Home</a><a href="#news">Announcements</a><a href="#events">Events</a>
    <a href="#mentors">Mentors</a><a href="#jobs">Jobs</a><a href="#give">Giving</a><a href="#gallery">Gallery</a>
  </nav>
  <div class="me"><div class="av" id="meAv"></div><div><span id="meName"></span><small id="meSub"></small></div></div>
</aside>
<main id="home">
  <div class="top">
    <button class="ico" aria-label="Notifications">🔔<em>2</em></button>
    <button class="ico" aria-label="Messages">💬</button>
    <button class="ico" id="theme" aria-label="Toggle theme">◐</button>
  </div>
  <div class="hero">
    <div>
      <h1 id="greet"></h1>
      <p>Your batchmates, mentors and institution news in one place. Here’s what changed since you last visited.</p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="prof">
      <header><h3>Your profile</h3><span id="pct">0%</span></header>
      <div class="bar"><i id="fill"></i></div>
      <ul id="checks"></ul>
    </div>
  </div>
</main></div>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/profile.js"></script>
</body></html>
