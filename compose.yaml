services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_test_root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: alumni
      MYSQL_USER: alumni
      MYSQL_PASSWORD: alumni_local
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
volumes:
  mysql-data:
  mongo-data:
